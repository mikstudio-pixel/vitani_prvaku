name: Tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    if: github.repository == 'mikstudio-pixel/vitani_prvaku'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /vitani_prvaku
          NEXT_PUBLIC_APP_VERSION: ${{ github.sha }}
