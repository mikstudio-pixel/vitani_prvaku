<!doctype html>
<html lang="cs" class="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Portrait visitor regression — synthetic camera</title><style>body:has(main[data-portrait="holding"]) #fixture-controls {visibility:hidden}</style></head>
<body><div id="root"></div><aside id="fixture-controls" style="position:fixed;z-index:10;bottom:60px;left:12px;background:#111;padding:8px;font-size:12px"><button id="test">Testovat návštěvníky</button> <button id="freeze">Vyfotit a zastavit portrét</button> <button id="no-face">Záběr bez člověka</button> <output id="result">Umělá kamera; nejprve klepněte na mísu.</output></aside>
<script type="module">
  import React from 'react';
  import { createRoot } from 'react-dom/client';
  import { InstallationApp } from '../web/installation-app.tsx';
  import '../app/globals.css';
  import { FluidBowl } from '../lib/fluid.ts';
  import { PortraitProcessor } from '../lib/portrait-processor.ts';
  let rejectedPortrait;
  const processPortrait = PortraitProcessor.prototype.process;
  PortraitProcessor.prototype.process = function(image) {
    rejectedPortrait = null;
    return processPortrait.call(this, image).catch(error => { rejectedPortrait = error; throw error; });
  };
  // This local fixture cannot request or access a hardware camera.
  const picture = new Image(); picture.src = '/outputs/portrait-test.jpg'; await picture.decode();
  const source = document.createElement('canvas'); source.width = picture.width; source.height = picture.height;
  let hasFace = true;
  const paint = () => {
    const context = source.getContext('2d'); context.fillStyle = '#2e3750'; context.fillRect(0,0,source.width,source.height);
    if (hasFace) context.drawImage(picture,0,0); requestAnimationFrame(paint);
  }; paint();
  let fluid;
  const setPortrait = FluidBowl.prototype.setPortrait;
  FluidBowl.prototype.setPortrait = function(image) { fluid = this; return setPortrait.call(this,image); };
  Object.defineProperty(navigator, 'mediaDevices', { configurable: true, value: {
    getUserMedia: async () => {
      if (new URLSearchParams(location.search).has('deny')) throw new DOMException('Synthetic denial', 'NotAllowedError');
      return source.captureStream(30);
    },
  } });
  // Keep desktop fallback independent of hardware sensors in this fixture.
  Object.defineProperty(window, 'DeviceOrientationEvent', { configurable: true, value: undefined });
  createRoot(document.getElementById('root')).render(React.createElement(InstallationApp));
  const capture = HTMLElement.prototype.setPointerCapture;
  HTMLElement.prototype.setPointerCapture = function(id) { if (id < 9000) Reflect.apply(capture, this, [id]); };
  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
  const until = async (condition, timeout = 30000) => {
    const deadline = performance.now() + timeout;
    while (!condition()) { if (performance.now() > deadline) throw new Error('Vypršel čas zpracování'); await wait(30); }
  };
  document.querySelector('#freeze').onclick = async () => {
    const result = document.querySelector('#result'), root = document.querySelector('main'), bowl = document.querySelector('.bowl');
    try {
      if (root.dataset.camera !== 'ready') throw new Error('Nejprve klepněte na mísu');
      bowl.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,pointerId:9010,pointerType:'touch',clientX:700,clientY:400}));
      await wait(1100); bowl.dispatchEvent(new PointerEvent('pointerup',{bubbles:true,pointerId:9010,pointerType:'touch'}));
      await until(() => root.dataset.portrait === 'holding'); fluid.setPaused(true);
      document.querySelector('#fixture-controls').style.visibility='visible';
      result.textContent='PASS: skutečná izolace → bliknutí → vynoření v kapalině; pozastaveno pro náhled';
    } catch(error) { result.textContent=`FAIL: ${error.message}`; }
  };
  document.querySelector('#no-face').onclick = async () => {
    const result = document.querySelector('#result'), bowl = document.querySelector('.bowl'); hasFace = false;
    try {
      bowl.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,pointerId:9011,pointerType:'touch',clientX:700,clientY:400}));
      await wait(1100); bowl.dispatchEvent(new PointerEvent('pointerup',{bubbles:true,pointerId:9011,pointerType:'touch'}));
      await until(() => rejectedPortrait?.message.includes('Obličej nenalezen'));
      if (document.querySelector('main').dataset.portrait !== 'idle') throw new Error('Neúspěšný záběr zablokoval aplikaci');
      result.textContent='PASS: záběr bez obličeje odmítnut, žádná původní fotografie v kapalině; další návštěvník může přijít';
    } catch(error) { result.textContent=`FAIL: ${error.message}`; } finally { hasFace = true; }
  };
  const assert = (value, message) => { if (!value) throw new Error(message); };
  document.getElementById('test').onclick = async () => {
    const result = document.getElementById('result'), root = document.querySelector('main'), bowl = document.querySelector('.bowl');
    const pointer = (type, id, x = 200, y = 200) => bowl.dispatchEvent(new PointerEvent(type, { bubbles: true, pointerId: id, pointerType: 'touch', clientX: x, clientY: y }));
    try {
      assert(root.dataset.camera === 'ready', 'Nejprve klepněte na mísu pro přípravu umělé kamery');
      pointer('pointerdown', 9001); await wait(250); pointer('pointerup', 9001); await wait(1000);
      assert(root.dataset.portrait === 'idle', 'Short touch must not take a photograph');
      pointer('pointerdown', 9002); pointer('pointermove', 9002, 250, 200); await wait(1200); pointer('pointerup', 9002);
      assert(root.dataset.portrait === 'idle', 'Dragging must cancel');
      pointer('pointerdown', 9003); pointer('pointerdown', 9004); await wait(1200); pointer('pointerup', 9003); pointer('pointerup', 9004);
      assert(root.dataset.portrait === 'idle', 'Two fingers must cancel');
      pointer('pointerdown', 9005); await wait(1100); pointer('pointerup', 9005);
      await until(() => root.dataset.portrait === 'flash');
      assert(root.dataset.portrait === 'flash', 'A one-second hold must take a photograph');
      result.textContent = 'První portrét vyfotografován. Ověřuji dalšího návštěvníka…';
      await wait(4000);
      assert(root.dataset.portrait === 'holding', 'Portrait must emerge after the flash');
      bowl.dispatchEvent(new KeyboardEvent('keydown', { bubbles: true, key: 'r' })); await wait(150);
      assert(root.dataset.portrait === 'idle', 'Reset must wait for another photograph');
      assert(root.dataset.camera === 'ready', 'Camera must remain warm between visitors');
      pointer('pointerdown', 9006); await wait(1100); pointer('pointerup', 9006);
      await until(() => root.dataset.portrait === 'flash');
      assert(root.dataset.portrait === 'flash', 'Second visitor must get a new photograph');
      result.textContent = 'PASS: short touch, drag, multiple fingers, one-second capture, reset, second visitor';
    } catch (error) { result.textContent = `FAIL: ${error.message}`; console.error(error); }
  };
</script></body></html>
