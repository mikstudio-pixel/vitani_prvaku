<!doctype html>
<html lang="cs" class="dark">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Browser recovery regression</title></head>
  <body>
    <div id="root"></div>
    <script type="module">
      // Local QA only: fail the first and third WebGL allocations to cover both
      // initial failure and failure after recovery. Deny motion access so input is
      // verified independently of real device sensors.
      import React from 'react';
      import { createRoot } from 'react-dom/client';
      import Home from '../app/page.tsx';
      import '../app/globals.css';
      const getContext = HTMLCanvasElement.prototype.getContext;
      let allocations = 0;
      HTMLCanvasElement.prototype.getContext = function(...args) {
        if (args[0] === 'webgl2' && [1, 3].includes(++allocations)) {
          throw new Error(`Test: graphics allocation ${allocations} failed`);
        }
        return Reflect.apply(getContext, this, args);
      };
      Object.defineProperty(window, 'DeviceOrientationEvent', {
        configurable: true,
        value: { requestPermission: async () => 'denied' },
      });
      createRoot(document.getElementById('root')).render(React.createElement(Home));
    </script>
  </body>
</html>
