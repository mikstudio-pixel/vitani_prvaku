<!doctype html><html lang="cs"><head><meta charset="utf-8"><title>Portrait liquid GPU regression</title></head>
<body style="background:#111;color:#eee"><canvas style="width:420px;height:420px"></canvas><output>Running…</output>
<script type="module">
  import { FluidBowl } from '../lib/fluid.ts';
  import { paintPortrait } from './synthetic-portrait.js';
  const canvas = document.querySelector('canvas'), output = document.querySelector('output');
  const source = document.createElement('canvas'); source.width = source.height = 512; paintPortrait(source);
  const bowl = new FluidBowl(canvas, { quality: 'performance', automaticCrests: true, onTelemetry: () => {}, ambientFlow: true });
  const frame = () => new Promise(resolve => requestAnimationFrame(resolve));
  const assert = (condition, message) => { if (!condition) throw new Error(message); };
  const gl = canvas.getContext('webgl2');
  const material = () => { const values = new Float32Array(bowl.dye.read.size ** 2 * 4); gl.bindFramebuffer(gl.FRAMEBUFFER, bowl.dye.read.buffer); gl.readPixels(0, 0, bowl.dye.read.size, bowl.dye.read.size, gl.RGBA, gl.FLOAT, values); return values; };
  const difference = (a, b) => { let sum = 0; for (let i = 0; i < a.length; i += 4) sum += Math.abs(a[i] - b[i]); return sum / (a.length / 4); };
  try {
    const before = material();
    bowl.setPortrait(source.getContext('2d').getImageData(0, 0, 512, 512));
    bowl.setPaused(true);
    assert(difference(before, material()) === 0, 'Capture must not replace the current liquid');
    for (let i = 0; i < 100; i++) bowl.stepMaterial(1 / 30);
    assert(bowl.portraitPhase === 'holding', 'Portrait must emerge gradually');
    assert(difference(before, material()) > .05, 'The guide must rearrange the actual material');
    bowl.render();
    output.textContent = 'Pixelated portrait gathered from the liquid. Waiting before dissolve…';
    const holdAt = performance.now(); while (performance.now() - holdAt < 4000) await frame();
    for (let i = 0; i < 150 && bowl.portraitActive; i++) bowl.stepMaterial(1 / 30);
    assert(bowl.portraitPhase === 'idle', 'The next visitor must become available automatically');
    assert(difference(before, material()) < .001, 'Dissolve must return to the previous fluid field');
    bowl.setPaused(false); bowl.setPortrait(source.getContext('2d').getImageData(0, 0, 512, 512)); bowl.reset();
    assert(!bowl.portraitActive, 'Reset must discard the portrait');
    assert(gl.getError() === gl.NO_ERROR, 'GPU mask and gathering must be error free');
    output.textContent = 'PASS: continuous fluid, guided reveal, dissolve, repeat readiness, reset';
  } catch (error) { output.textContent = `FAIL: ${error.message}`; console.error(error); }
  finally { bowl.dispose(); }
</script></body></html>
