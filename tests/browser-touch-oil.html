<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><title>Barevná kapalina — GPU test</title></head>
<body style="background:#111;color:#eee;font:14px sans-serif">
<canvas style="width:600px;height:600px;touch-action:none"></canvas>
<p><button id="run">Ověřit barevnou kapalinu</button> <button id="preview">Ukázat duhovou stopu</button></p>
<output>Lokální test bez kamery. Dotykem a tažením obarvíte kapalinu.</output>
<script type="module">
import { FluidBowl } from '../lib/fluid.ts';
const canvas = document.querySelector('canvas'), output = document.querySelector('output');
const bowl = new FluidBowl(canvas, { quality: 'performance', automaticCrests: true });
const gl = canvas.getContext('webgl2');
const assert = (value, message) => { if (!value) throw new Error(message); };
const field = target => {
  const data = new Float32Array(target.size ** 2 * 4);
  gl.bindFramebuffer(gl.FRAMEBUFFER, target.buffer);
  gl.readPixels(0, 0, target.size, target.size, gl.RGBA, gl.FLOAT, data);
  return data;
};
const pixels = () => {
  const data = new Uint8Array(canvas.width * canvas.height * 4);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.readPixels(0, 0, canvas.width, canvas.height, gl.RGBA, gl.UNSIGNED_BYTE, data);
  return data;
};
const colorCount = data => {
  let count = 0;
  for (let i = 0; i < data.length; i += 4) if (Math.max(...data.subarray(i, i+3)) - Math.min(...data.subarray(i, i+3)) > 35) count++;
  return count;
};
const concentrations = data => data.filter((_, i) => i % 4 === 3);
const maximum = data => {
  let result = 0;
  for (let i = 3; i < data.length; i += 4) result = Math.max(result, data[i]);
  return result;
};
document.getElementById('run').onclick = () => {
  try {
    bowl.setPaused(true); bowl.reset();
    assert(colorCount(pixels()) === 0, 'Untouched liquid must stay monochrome');
    bowl.setTouchAt({ x: .64, y: .57 });
    for (let i = 0; i < 15; i++) bowl.tick(1/30);
    const held = field(bowl.touchPigment.read), colored = colorCount(pixels());
    assert([...held].every(Number.isFinite) && concentrations(held).every(value => value >= 0 && value <= 1), 'Pigment must stay finite and bounded');
    assert(maximum(held) > .7 && colored > 1000, 'Touch must color the liquid material');
    const material = field(bowl.dye.read);
    bowl.render();
    assert(field(bowl.dye.read).every((value, i) => value === material[i]), 'Color rendering must preserve the liquid material');
    const surface = field(bowl.surface.read);
    const upload = (target, data) => {
      gl.bindTexture(gl.TEXTURE_2D, target.texture);
      gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, target.size, target.size, gl.RGBA, gl.FLOAT, data);
    };
    const flat = new Float32Array(material.length);
    for (let i = 0; i < flat.length; i += 4) flat[i] = .5;
    upload(bowl.dye.read, flat); upload(bowl.surface.read, new Float32Array(surface.length));
    bowl.render();
    assert(colorCount(pixels()) > 1000, 'Pigment must color flat liquid too, independently of reflections');
    upload(bowl.dye.read, material); upload(bowl.surface.read, surface);
    bowl.setTouchAt(null);
    // Isolate passive advection from the gravity simulation using a known flow.
    const velocity = new Float32Array(bowl.simSize ** 2 * 4);
    for (let i = 0; i < velocity.length; i += 4) velocity[i] = .1;
    gl.bindTexture(gl.TEXTURE_2D, bowl.mixingVelocity.read.texture);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, bowl.simSize, bowl.simSize, gl.RGBA, gl.FLOAT, velocity);
    const centroid = data => {
      let sum = 0, x = 0;
      for (let i = 0; i < data.length; i += 4) { sum += data[i+3]; x += data[i+3] * ((i/4) % bowl.simSize + .5) / bowl.simSize; }
      return x / sum;
    };
    for (let i = 0; i < 10; i++) {
      bowl.draw('pigmentStep', bowl.touchPigment.write, { pigment: bowl.touchPigment.read, velocity: bowl.mixingVelocity.read, dt: 1/30, depositing: false, transporting: true, hue: 0 });
      bowl.swap(bowl.touchPigment);
    }
    assert(centroid(field(bowl.touchPigment.read)) > centroid(held) + .02, 'Oil must travel with the material current');
    const oldRadius = bowl.boundaryRadius, oldCenter = centroid(field(bowl.touchPigment.read));
    bowl.setRimMode('under');
    const reframedCenter = centroid(field(bowl.touchPigment.read));
    assert(Math.abs(reframedCenter-.5-(oldCenter-.5)*bowl.boundaryRadius/oldRadius) < .004, 'Changing the rim must carry the pigment with the liquid');
    bowl.setRimMode('curved');
    assert(Math.abs(centroid(field(bowl.touchPigment.read))-oldCenter) < .004, 'Returning the rim must preserve pigment alignment');
    bowl.portraitElapsed = 0; bowl.render();
    assert(colorCount(pixels()) === 0, 'Portrait must retain its monochrome material');
    bowl.portraitElapsed = -1;
    // Pausing physics freezes pigment transport, while concentration still fades.
    bowl.setPhysicsPaused(true);
    const beforePause = field(bowl.touchPigment.read);
    bowl.tick(1/30);
    const afterPause = field(bowl.touchPigment.read), decay = Math.exp(-(1/30)/2.2);
    assert(afterPause.every((value, i) => Math.abs(value-beforePause[i]*decay) < .00001), 'Paused pigment must only decay, without drifting');
    const frozenMaterial = field(bowl.dye.read);
    for (let i = 0; i < 240; i++) bowl.tick(1/30);
    assert(field(bowl.dye.read).every((value, i) => value === frozenMaterial[i]), 'Paused liquid must remain stationary');
    bowl.setPhysicsPaused(false);
    assert(maximum(field(bowl.touchPigment.read)) < .03, 'Release must fade the pigment');
    bowl.reset();
    assert(field(bowl.touchPigment.read).every(value => value === 0) && colorCount(pixels()) === 0, 'Reset must clear all color');
    // The visible rim extends beyond the solver domain in these modes.
    for (const mode of ['curved', 'hybrid']) {
      bowl.setRimMode(mode); bowl.reset(); bowl.setTouchAt({ x: .99, y: .5 });
      for (let i = 0; i < 15; i++) bowl.tick(1/30);
      const rim = pixels(), x = Math.floor(canvas.width*.985), y = Math.floor(canvas.height*.5);
      const offset = (y*canvas.width+x)*4;
      assert(Math.max(...rim.subarray(offset,offset+3))-Math.min(...rim.subarray(offset,offset+3)) > 10, 'Pigment must extend through the visible '+mode+' rim');
    }
    bowl.reset();
    assert(gl.getError() === gl.NO_ERROR, 'GPU passes must be error-free');
    output.textContent = `PASS: ${colored} colored liquid pixels, flat liquid colored, bounded pigment, fluid transport, rim alignment and tint, unchanged material, monochrome portrait, paused transport, release fade, reset`;
  } catch (error) { output.textContent = `FAIL: ${error.message}`; console.error(error); }
};
document.getElementById('preview').onclick = () => {
  bowl.setPaused(true); bowl.reset();
  for (let i = 0; i < 36; i++) {
    const angle = i / 36 * Math.PI * 1.3;
    bowl.setTouchAt({ x: .5 + Math.cos(angle)*.21, y: .5 + Math.sin(angle)*.18 });
    bowl.tick(1/30);
  }
  bowl.setTouchAt(null);
  output.textContent = 'Duhová stopa po tažení prstu. Náhled je pozastavený.';
};
canvas.onpointerdown = event => { canvas.setPointerCapture(event.pointerId); bowl.setPaused(false); move(event); };
const move = event => { const box = canvas.getBoundingClientRect(); bowl.setTouchAt({ x: (event.clientX-box.left)/box.width, y: 1-(event.clientY-box.top)/box.height }); };
canvas.onpointermove = event => { if (canvas.hasPointerCapture(event.pointerId)) move(event); };
canvas.onpointerup = canvas.onpointercancel = canvas.onlostpointercapture = () => bowl.setTouchAt(null);
window.addEventListener('pagehide', () => bowl.dispose());
</script></body></html>
